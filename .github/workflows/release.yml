name: Create New Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build configuration (production or debug)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - debug

jobs:
  build:
    runs-on: macos-26
    env:
      CONFIGURATION: ${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}
      BUILD_SUFFIX: ${{ inputs.build_type == 'debug' && ' (Debug)' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'
      
      - name: Use Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Compile Feather
        run: | 
          agvtool new-version -all $(git rev-parse HEAD)
          make CONFIGURATION=${{ env.CONFIGURATION }}
          mkdir upload
          mv packages/* upload/

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Feather v${{ env.VERSION }}${{ env.BUILD_SUFFIX }}
          tag_name: v${{ env.VERSION }}
          files: |
            upload/*ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
